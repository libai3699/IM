# OpenIM Route Service - 优化后的 Nginx 配置
# 用途：反向代理路由服务，提供高性能与安全性

# 1. HTTP 强制跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name route.eeee3333.cfd;
    
    # 记录访问日志以便排查跳转问题
    access_log /var/log/nginx/route-access.log;
    
    return 301 https://$server_name$request_uri;
}

# 2. HTTPS 主服务
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name route.eeee3333.cfd;

    # --- SSL 证书配置 ---
    # 路径已根据实际环境修正为 fullchain.pem 和 privkey.pem
    ssl_certificate      /www/server/nginx/conf/ssl/route.eeee3333.cfd/fullchain.pem;
    ssl_certificate_key  /www/server/nginx/conf/ssl/route.eeee3333.cfd/privkey.pem;

    # --- SSL 安全与性能优化 ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- 日志配置 ---
    access_log /var/log/nginx/route-access.log;
    error_log  /var/log/nginx/route-error.log;

    # --- 基础优化 ---
    client_max_body_size 100M;
    keepalive_timeout 70;

    # --- 公共 Proxy 设置 ---
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # WebSocket 支持
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # 1. 根路径转发
    location / {
        proxy_pass http://127.0.0.1:10010;
    }

    # 2. API 路径优化 (带完整的 CORS 支持)
    location /api/ {
        proxy_pass http://127.0.0.1:10010;
        
        # CORS 配置
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        
        # 处理 OPTIONS 预检请求
        if ($request_method = OPTIONS) {
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # 3. 健康检查 (关闭访问日志以减少磁盘IO)
    location /api/health {
        proxy_pass http://127.0.0.1:10010;
        access_log off;
    }
}
