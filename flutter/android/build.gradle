buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        maven {
            url = rootProject.file('../local_maven').toURI()
            metadataSources {
                mavenPom()
                artifact()
            }
        }
        maven { url "https://storage.googleapis.com/download.flutter.io" }
        google()
        mavenCentral()
        maven { url "https://dl.google.com/dl/android/maven2/" }   // fcm
        maven { url 'https://developer.huawei.com/repo/' }    // hms
        maven { url "https://mvn.gt.getui.com/nexus/content/repositories/releases/" }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/jcenter' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/google' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/gradle-plugin' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.5'  // fcm
        classpath 'com.huawei.agconnect:agcp:1.5.2.300'    // hms
    }
}

allprojects {
    repositories {
        maven {
            url = rootProject.file('../local_maven').toURI()
            metadataSources {
                mavenPom()
                artifact()
            }
        }
        maven { url "https://storage.googleapis.com/download.flutter.io" }
        google()
        mavenCentral()
        maven { url "https://dl.google.com/dl/android/maven2/" }   // fcm
        maven { url 'https://developer.huawei.com/repo/' }    // hms
        maven { url "https://mvn.gt.getui.com/nexus/content/repositories/releases/" }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/jcenter' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/google' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/gradle-plugin' }
    }

    configurations.configureEach {
        resolutionStrategy.force 'androidx.exifinterface:exifinterface:1.3.7'
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
