#fixme  Clone openIM Server project before using docker-compose,project address：https://github.com/OpenIMSDK/Open-IM-Server.git
version: '3'

networks:
  server:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: '${DOCKER_BRIDGE_SUBNET:-172.28.0.0/16}'
          gateway: '${DOCKER_BRIDGE_GATEWAY:-172.28.0.1}'


services:
  mongodb:
    image: mongo:${MONGODB_IMAGE_VERSION-6.0.2}
    ports:
      - "127.0.0.1:${MONGO_PORT:-37017}:27017"
    container_name: mongo
    command: --wiredTigerCacheSizeGB 2 --auth --maxConns 1000  # ✅ 增加缓存和最大连接数
    volumes:
      - "${DATA_DIR:-./}/components/mongodb/data/db:/data/db"
      - "${DATA_DIR:-./}/components/mongodb/data/logs:/data/logs"
      - "${DATA_DIR:-./}/components/mongodb/data/conf:/etc/mongo"
      - "./scripts/mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro"
    environment:
      - TZ=Asia/Shanghai
      - wiredTigerCacheSizeGB=2  # ✅ 从1G增加到2G
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-openIm123456789}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE:-openIM_v3}
      - MONGO_OPENIM_USERNAME=${MONGO_OPENIM_USERNAME:-openIM} # Non-root username
      - MONGO_OPENIM_PASSWORD=${MONGO_OPENIM_PASSWORD:-openIm123456789} # Non-root password
    restart: always
    deploy:
      resources:
        limits:
          memory: 5G  # ✅ 从3G增加到5G，防止OOM
        reservations:
          memory: 2G  # ✅ 从1G增加到2G，保证基础内存
    networks:
      server:
        ipv4_address: ${MONGO_NETWORK_ADDRESS:-172.28.0.2}

  redis:
    image: redis:${REDIS_IMAGE_VERSION:-7.0.0}
    container_name: redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - "${DATA_DIR:-./}/components/redis/data:/data"
      - "${DATA_DIR:-./}/components/redis/config/redis.conf:/usr/local/redis/config/redis.conf"
    environment:
      TZ: Asia/Shanghai
    restart: always
    sysctls:
      net.core.somaxconn: 2048  # ✅ 从1024增加到2048
    command: redis-server --requirepass ${REDIS_PASSWORD:-openIm123456789} --appendonly yes --maxclients 5000 --maxmemory 2gb --maxmemory-policy allkeys-lru  # ✅ 增加最大客户端连接数和内存管理
    networks:
      server:
        ipv4_address: ${REDIS_NETWORK_ADDRESS:-172.28.0.3}

  zookeeper:
    image: zookeeper:${ZOOKEEPER_IMAGE_VERSION:-3.8}
    container_name: zookeeper
    ports:
      - "127.0.0.1:${ZOOKEEPER_PORT:-12181}:2181"
    volumes:
      - "/etc/localtime:/etc/localtime"
    environment:
      - ZOO_MY_ID=1
      - ZOO_SERVERS=server.1=0.0.0.0:2888:3888;2181
      - TZ="Asia/Shanghai"
    restart: always
    networks:
      server:
        ipv4_address: ${ZOOKEEPER_NETWORK_ADDRESS:-172.28.0.5}

  kafka:
    image: 'wurstmeister/kafka:${KAFKA_IMAGE_VERSION:-latest}'
    container_name: kafka
    restart: always
    ports:
      - "${KAFKA_PORT:-19094}:9094"
    volumes:
      - "${DATA_DIR:-./}/components/kafka:/kafka"
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-19094}
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CREATE_TOPICS=offlineMsgToMongoMysql:8:1,latestMsgToRedis:8:1,msgToPush:8:1
      - KAFKA_LOG_RETENTION_HOURS=1
      - KAFKA_LOG_RETENTION_BYTES=1073741824
      - KAFKA_LOG_SEGMENT_BYTES=268435456
      - KAFKA_COMPRESSION_TYPE=gzip
      - TZ=Asia/Shanghai
    depends_on:
      - zookeeper
    networks:
      server:
        ipv4_address: ${KAFKA_NETWORK_ADDRESS:-172.28.0.4}

  minio:
    image: minio/minio:${MINIO_IMAGE_VERSION:-latest}
    ports:
      - "127.0.0.1:${MINIO_PORT:-10005}:9000"
      - "9090:9090"
    container_name: minio
    volumes:
      - "${DATA_DIR:-./}/components/mnt/data:/data"
      - "${DATA_DIR:-./}/components/mnt/config:/root/.minio"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-root}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-openIm123456789}"
    restart: always
    command: minio server /data --console-address ':9090'
    networks:
      server:
        ipv4_address: ${MINIO_NETWORK_ADDRESS:-172.28.0.6}

  mysql:
    image: mysql:${MYSQL_IMAGE_VERSION:-8.0}
    container_name: mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    volumes:
      - "${DATA_DIR:-./}/components/mysql/data:/var/lib/mysql"
      - "${DATA_DIR:-./}/components/mysql/conf:/etc/mysql/conf.d"
      - "${DATA_DIR:-./}/components/mysql/logs:/var/log/mysql"
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-P8x$K9mQ#vR2wN5L}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-openIM_v3}
    command:
      - --max-connections=3000              # ✅ 从50增加到3000，支持高并发
      - --max-user-connections=2500         # ✅ 从20增加到2500
      - --skip-log-bin
      - --performance-schema=OFF
      - --innodb-flush-log-at-trx-commit=2
      - --skip-name-resolve
      - --max-allowed-packet=32M            # ✅ 从16M增加到32M
      - --bind-address=0.0.0.0
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=1G        # ✅ 增加缓冲池
      - --wait-timeout=300                  # ✅ 连接超时5分钟
    restart: always
    networks:
      server:
        ipv4_address: ${MYSQL_NETWORK_ADDRESS:-172.28.0.8}

